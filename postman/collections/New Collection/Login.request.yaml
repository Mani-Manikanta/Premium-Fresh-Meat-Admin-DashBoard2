$kind: http-request
name: Login
order: 1000
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "bammidimanikanta928@gmail.com",
      "password": "Mani@123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 200 && json.token) {
          pm.collectionVariables.set('token', json.token);
          console.log('Bearer token saved to {{token}}');
      } else {
          console.error('Login failed – token not saved');
      }
