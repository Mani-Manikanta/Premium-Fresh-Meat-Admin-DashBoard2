$kind: http-request
name: Update user
order: 4000
method: PUT
url: '{{baseUrl}}/users/:id'
pathVariables:
  - key: id
    value: '2'
auth:
  type: bearer
  credentials:
    token: '{{token}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Name",
      "email": "updated@example.com",
      "role": "user"
    }
