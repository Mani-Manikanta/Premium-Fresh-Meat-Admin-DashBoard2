$kind: http-request
name: Update seller
order: 4000
method: PUT
url: '{{baseUrl}}/sellers/:id'
pathVariables:
  - key: id
    value: '1'
auth:
  type: bearer
  credentials:
    token: '{{token}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "shop_name": "Updated Shop Name",
      "status": "Inactive"
    }
